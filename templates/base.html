<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SmartHire{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('index') }}">SmartHire</a>
<div>
{% if session.get('user_id') %}
<a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('dashboard') }}">Dashboard</a>
<a class="btn btn-warning btn-sm" href="{{ url_for('logout') }}">Logout</a>
{% else %}
<a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('login') }}">Login</a>
<a class="btn btn-warning btn-sm" href="{{ url_for('register') }}">Register</a>
{% endif %}
</div></div></nav>
<main class="container py-5">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body></html>
